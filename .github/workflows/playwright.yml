name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test_e2e:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright E2E tests
        run: pnpm test:e2e --ignore-snapshots

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-e2e-report
          path: playwright-report/
          retention-days: 7

  test_vrt:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright VRT
        run: pnpm test:vrt
        continue-on-error: true

      - name: Commit and Push if UI changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain tests/)" ]; then
            echo "UIの変更（または新規画像）を検知しました。自動コミットします。"
            git add tests/
            git commit -m "chore(vrt): UI変更のスクリーンショットを自動更新 [skip ci]"
            git push
            
            echo "::error::UIに差分があったため、最新のスクショをプッシュしました。PRの Files changed で目視確認してください。"
            exit 1
          else
            echo "UIの変更はありません。Pass!"
          fi
